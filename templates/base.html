<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Aether &amp; Arcana{% endblock %}</title>
  <meta name="description" content="{% block description %}Tarot divination for the modern age. Draw a reading or explore all 78 cards.{% endblock %}">

  <!-- Open Graph — Facebook, LinkedIn, Discord, Slack, WhatsApp, Telegram -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Aether &amp; Arcana">
  <meta property="og:url" content="{{ request.url }}">
  <meta property="og:title" content="{% block og_title %}Aether &amp; Arcana{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Tarot divination for the modern age. Draw a reading or explore all 78 cards.{% endblock %}">
  <meta property="og:image" content="{% block og_image %}{{ url_for('static', filename='screenshots/home.png', _external=True) }}{% endblock %}">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="800">
  <meta property="og:image:alt" content="{% block og_image_alt %}Aether &amp; Arcana — tarot divination for the modern age{% endblock %}">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}Aether &amp; Arcana{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_description %}Tarot divination for the modern age. Draw a reading or explore all 78 cards.{% endblock %}">
  <meta name="twitter:image" content="{% block twitter_image %}{{ url_for('static', filename='screenshots/home.png', _external=True) }}{% endblock %}">
  <meta name="twitter:image:alt" content="{% block twitter_image_alt %}Aether &amp; Arcana — tarot divination for the modern age{% endblock %}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/celestial.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <nav class="site-nav" aria-label="Main navigation">
    <a href="/" class="nav-logo">Aether &amp; Arcana</a>
    <ul class="nav-links">
      <li><a href="/library" class="nav-link{% if request.path.startswith('/library') %} active{% endif %}">Library</a></li>
      <li><a href="/reading/one" class="nav-link{% if request.path == '/reading/one' %} active{% endif %}">One Card</a></li>
      <li><a href="/reading/three" class="nav-link{% if request.path == '/reading/three' %} active{% endif %}">Triad Spread</a></li>
    </ul>
  </nav>

  <div class="page-wrapper">
    {% block content %}{% endblock %}
  </div>

  <script src="{{ url_for('static', filename='js/starfield.js') }}"></script>
  {% block page_scripts %}{% endblock %}
</body>
</html>
